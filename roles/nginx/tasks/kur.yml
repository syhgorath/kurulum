- name: Docker mode
  when: k_mod == 'docker'
  block:
    - name: Web root
      ansible.builtin.file:
        path: "{{ k_ana }}/nginx/data/www"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: not (ansible_check_mode and kurulum_ana_durum == 'yeni')
    - name: Placeholder page (only when absent; never overwrites your files)
      ansible.builtin.copy:
        dest: "{{ k_ana }}/nginx/data/www/index.html"
        content: "<!doctype html><title>nginx</title><p>kurulum: nginx (docker) çalışıyor.</p>\n"
        force: false
        owner: root
        group: root
        mode: "0644"
      when: not (ansible_check_mode and kurulum_ana_durum == 'yeni')
      register: kd_nginx_sayfa
    - name: Install via Docker
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/ortak/tasks/docker_uygulama_kur.yml"

- name: Native mode
  when: k_mod == 'native'
  block:
    - name: Port 80 must be free for the package post-install start
      ansible.builtin.assert:
        that: kurulum_paket_var.stdout == '1' or 80 not in k_dinlenen
        fail_msg: >-
          kurulum: nginx paketi kurulurken servisi 80 portunda başlatmaya çalışır; 80 şu an dolu (ss). Önce 80'i kullanan süreci durdurun
          ya da docker modunu kullanın. Hiçbir şey kurulmadı.
        quiet: true
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
      register: kd_nginx_paket
    - name: Managed site
      ansible.builtin.template:
        src: site.conf.j2
        dest: /etc/nginx/sites-available/kurulum
        owner: root
        group: root
        mode: "0644"
      register: kd_nginx_site
    - name: Enable the managed site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/kurulum
        dest: /etc/nginx/sites-enabled/kurulum
        state: link
      # --check'te paket (ve sites-available) henüz yoksa bağ kurulamaz; önizleme "site + bağ yazılacak" der
      when: not (ansible_check_mode and kd_nginx_site is changed and kurulum_paket_var.stdout == '0')
      register: kd_nginx_bag
    - name: Disable the distribution default site (link only; file stays)
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      register: kd_nginx_varsayilan
    - name: Test the configuration
      ansible.builtin.command: nginx -t
      changed_when: false
      when: not ansible_check_mode
    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started
      when: not ansible_check_mode
      register: kd_nginx_servis
    - name: Reload nginx after a configuration change
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      when: not ansible_check_mode and (kd_nginx_site is changed or kd_nginx_bag is changed or kd_nginx_varsayilan is changed)
      register: kd_nginx_yenile
    - name: Connection keys
      ansible.builtin.include_role:
        name: env_dosyalari
        tasks_from: ortak
      when: not (ansible_check_mode and kurulum_ana_durum == 'yeni')
    - name: Record in the marker
      ansible.builtin.include_role:
        name: ana_klasor
        tasks_from: isaret_yaz
      vars:
        k_kayit: { mod: native, surum: dagitim, port: "{{ k_port | int }}", bind: "{{ k_bind }}", veri_yolu: "{{ k_katalog.native_veri }}" }
