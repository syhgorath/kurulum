# Kaldır: veriye dokunmaz (/var/lib/mysql ya da <ana>/mariadb/data kalır). apt purge YOK.
- name: Remove docker mode
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/ortak/tasks/docker_uygulama_kaldir.yml"
  when: k_kurulu and k_kayit_eski.mod == 'docker'

- name: Remove native mode
  when: k_kurulu and k_kayit_eski.mod == 'native'
  block:
    - name: Stop and disable MariaDB
      ansible.builtin.systemd:
        name: mariadb
        enabled: false
        state: stopped
      when: not ansible_check_mode
    - name: Remove the package (no purge, /var/lib/mysql and /etc/mysql stay)
      ansible.builtin.apt:
        name: mariadb-server
        state: absent
        purge: false
      register: kd_mariadb_paket_kaldir
    - name: Record the removal in the marker
      ansible.builtin.include_role:
        name: ana_klasor
        tasks_from: isaret_yaz
      vars:
        k_sil: true
        k_kayit: { mod: native, surum: dagitim, veri_yolu: "{{ k_katalog.native_veri }}", kaldirilma: "{{ ansible_facts['date_time']['date'] }}" }
    - name: Remove the connection keys from the shared .env
      ansible.builtin.include_role:
        name: env_dosyalari
        tasks_from: temizle

- name: Nothing to remove
  ansible.builtin.debug:
    msg: "kurulum: mariadb bu sunucuda kurulumla yönetilmiyor; yapılacak bir şey yok."
  when: not k_kurulu
