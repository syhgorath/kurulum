# Kaldır: veriye dokunmaz (/var/lib/redis ya da <ana>/redis/data kalır). apt purge YOK.
- name: Remove docker mode
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/ortak/tasks/docker_uygulama_kaldir.yml"
  when: k_kurulu and k_kayit_eski.mod == 'docker'

- name: Remove native mode
  when: k_kurulu and k_kayit_eski.mod == 'native'
  block:
    - name: Stop and disable Redis
      ansible.builtin.systemd:
        name: redis-server
        enabled: false
        state: stopped
      when: not ansible_check_mode
    - name: Remove the package (no purge, /var/lib/redis and /etc/redis stay)
      ansible.builtin.apt:
        name: redis-server
        state: absent
        purge: false
      register: kd_redis_paket_kaldir
    - name: Record the removal in the marker
      ansible.builtin.include_role:
        name: ana_klasor
        tasks_from: isaret_yaz
      vars:
        k_sil: true
        k_kayit: { mod: native, surum: dagitim, veri_yolu: "{{ k_katalog.native_veri }}", kaldirilma: "{{ ansible_facts['date_time']['date'] }}" }

- name: Nothing to remove
  ansible.builtin.debug:
    msg: "kurulum: redis bu sunucuda kurulumla yönetilmiyor; yapılacak bir şey yok."
  when: not k_kurulu
