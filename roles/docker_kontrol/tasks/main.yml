# Docker kontrolü (salt okunur, --check'te de çalışır). Sonuç: kurulum_docker_durum = yok | resmi | dagitim | snap | diger
#   yok -> kurulu değil (kur ister) · resmi/dagitim -> kurulu (DOKUNULMAZ) · snap/diger -> uyarı (desteklenmez, dokunulmaz)
- name: Probe Docker
  ansible.builtin.shell: |
    set -u
    p=$(command -v docker 2>/dev/null || true)
    st() { dpkg-query -W -f='${db:Status-Abbrev}' "$1" 2>/dev/null | grep -q '^ii' && echo 1 || echo 0; }
    snap=0; { [ -d /snap/docker ] || [ -d /var/snap/docker ] || case "$(readlink -f "${p:-/nonexistent}" 2>/dev/null)" in /snap/*) true ;; *) false ;; esac; } && snap=1
    comp=0; [ -n "$p" ] && docker compose version >/dev/null 2>&1 && comp=1
    printf 'bin=%s ce=%s io=%s snap=%s compose=%s\n' "${p:-yok}" "$(st docker-ce)" "$(st docker.io)" "$snap" "$comp"
  args:
    executable: /bin/bash
  register: kurulum_docker_sonda
  changed_when: false
  check_mode: false

- name: Classify Docker
  ansible.builtin.set_fact:
    kurulum_docker_durum: >-
      {{ 'snap' if 'snap=1' in kurulum_docker_sonda.stdout
         else ('resmi' if 'ce=1' in kurulum_docker_sonda.stdout
         else ('dagitim' if 'io=1' in kurulum_docker_sonda.stdout
         else ('yok' if 'bin=yok' in kurulum_docker_sonda.stdout else 'diger'))) }}
    kurulum_docker_compose: "{{ 'compose=1' in kurulum_docker_sonda.stdout }}"
